services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wearstack
      POSTGRES_PASSWORD: wearstack
      POSTGRES_DB: wearstack
    ports: ["${DB_PORT:-5434}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wearstack"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://wearstack:wearstack@db:5432/wearstack
    ports: ["${BACKEND_PORT:-8010}:8000"]
    volumes: [./backend/app:/app/app]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8010}
    ports: ["${FRONTEND_PORT:-5173}:5173"]
    volumes: [./frontend/src:/app/src]
    depends_on: [backend]

volumes:
  pgdata:
